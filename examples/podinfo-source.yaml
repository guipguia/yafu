# A real upstream Git repo so we have something to reconcile.
# podinfo is a small public app maintained by the FluxCD team and is
# what most Flux tutorials use, so the manifests are stable.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: podinfo
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/stefanprodan/podinfo
  ref:
    branch: master
---
# Helm-side: same source produces a chart we install via HelmRelease.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: podinfo-charts
  namespace: flux-system
spec:
  interval: 5m
  url: https://stefanprodan.github.io/podinfo
