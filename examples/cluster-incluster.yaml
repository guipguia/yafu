# Registers the cluster yafu itself runs in as a managed cluster,
# using yafu's own ServiceAccount credentials. This is the simplest
# CRD-mode setup and mirrors what a real production deployment for a
# single-cluster install would look like.
apiVersion: yafu.io/v1alpha1
kind: Cluster
metadata:
  name: home
  namespace: yafu-system
spec:
  displayName: kind-yafu-test
  region: 'local · kind'
  environment: dev
  fluxNamespace: flux-system
  connection:
    inCluster: true
