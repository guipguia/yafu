name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        # The linter binary must be built with a Go >= go.mod's `go`
        # directive (1.26). golangci-lint v2.12.x is the first
        # 2.x line built with 1.26; older 2.x versions fail with
        # "language version (1.25) is lower than targeted (1.26)".
        # Pin to the latest 2.12 so a future linter regression
        # doesn't silently change behaviour.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.1
          args: --timeout=5m

  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -coverprofile=coverage.out ./cmd/... ./internal/... ./api/...
      - uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out

  build-go:
    name: Build Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...

  lint-web:
    name: Lint Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Fail when src/lib/api-types.ts is stale relative to
      # api/openapi.yaml — protects against the spec drifting away
      # from the TS the frontend imports.
      - run: npm run gen:check

  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci || npm install
      - run: npm test -- --run

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci || npm install
      - run: npm run build

  helm-lint:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
      - run: helm lint charts/yafu
      - run: helm template charts/yafu > /dev/null

  e2e:
    name: E2E (kind + Flux + yafu)
    runs-on: ubuntu-latest
    # Skip the long E2E for pure docs / chat / memory / images.
    # When the test set or any code path the test exercises changes,
    # the generic `paths` matcher above (workflow-level) lands us here.
    needs: [test-go, test-web, helm-lint, build-go]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: helm/kind-action@v1
        with:
          install_only: true

      - uses: azure/setup-helm@v5

      - name: Install Flux CLI
        run: curl -s https://fluxcd.io/install.sh | sudo bash

      - name: Run E2E
        env:
          # Tighten the per-step timeout; CI runners are stable.
          TIMEOUT: '180'
        run: make e2e

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== yafu pod ==="
          kubectl -n yafu-system describe deploy/yafu || true
          kubectl -n yafu-system logs deploy/yafu --tail=200 || true
          echo "=== Cluster CR ==="
          kubectl get clusters.yafu.io -o yaml || true
          echo "=== Flux ==="
          flux check || true
          flux get all -A || true
