{{- $rbacKey := .Values.authzPolicy.configMapKey | default "policy.yaml" -}}
{{- $rbacCM := .Values.authzPolicy.existingConfigMap -}}
{{- if and (not $rbacCM) .Values.authzPolicy.policy -}}
{{- $rbacCM = printf "%s-rbac" (include "yafu.fullname" .) -}}
{{- end -}}
{{- $authMode := .Values.auth.mode | default "anonymous" -}}
{{- $oidc := default (dict) .Values.auth.oidc -}}
{{- $oidcSecretName := "" -}}
{{- if eq $authMode "oidc" -}}
{{- $oidcSecretName = (default (dict) $oidc.secretRef).name -}}
{{- if not $oidc.issuer -}}{{- fail "auth.oidc.issuer is required when auth.mode=oidc" -}}{{- end -}}
{{- if not $oidc.clientId -}}{{- fail "auth.oidc.clientId is required when auth.mode=oidc" -}}{{- end -}}
{{- if not $oidc.redirectURL -}}{{- fail "auth.oidc.redirectURL is required when auth.mode=oidc" -}}{{- end -}}
{{- if not $oidcSecretName -}}{{- fail "auth.oidc.secretRef.name is required when auth.mode=oidc" -}}{{- end -}}
{{- end -}}
{{- $clientSecretKey := (default (dict) $oidc.secretRef).clientSecretKey | default "client_secret" -}}
{{- $cookieSecretKey := (default (dict) $oidc.secretRef).cookieSecretKey | default "cookie_secret" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yafu.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yafu.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "yafu.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "yafu.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "yafu.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: yafu
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --addr=:{{ .Values.service.targetPort }}
            - --log-level={{ .Values.logLevel }}
            - --cluster-mode={{ .Values.clusterMode | default "crd" }}
            - --auth-mode={{ $authMode }}
            - --metrics-addr=0
            - --probe-addr=0
            {{- if $rbacCM }}
            - --rbac-file=/etc/yafu/rbac/{{ $rbacKey }}
            {{- end }}
            {{- if eq $authMode "oidc" }}
            - --oidc-issuer={{ $oidc.issuer }}
            - --oidc-client-id={{ $oidc.clientId }}
            - --oidc-redirect-url={{ $oidc.redirectURL }}
            - --oidc-scopes={{ $oidc.scopes | default "openid,email,profile,groups" }}
            - --oidc-groups-claim={{ $oidc.groupsClaim | default "groups" }}
            - --oidc-secure-cookie={{ ternary "true" "false" (default true $oidc.secureCookie) }}
            - --oidc-client-secret-file=/etc/yafu/oidc/{{ $clientSecretKey }}
            - --oidc-cookie-secret-file=/etc/yafu/oidc/{{ $cookieSecretKey }}
            {{- end }}
            {{- with .Values.tracing }}
            {{- if .endpoint }}
            - --otel-endpoint={{ .endpoint }}
            - --otel-insecure={{ ternary "true" "false" (default true .insecure) }}
            - --otel-sample-rate={{ .sampleRate | default 1.0 }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or $rbacCM (eq $authMode "oidc") }}
          volumeMounts:
            {{- if $rbacCM }}
            - name: rbac
              mountPath: /etc/yafu/rbac
              readOnly: true
            {{- end }}
            {{- if eq $authMode "oidc" }}
            - name: oidc
              mountPath: /etc/yafu/oidc
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or $rbacCM (eq $authMode "oidc") }}
      volumes:
        {{- if $rbacCM }}
        - name: rbac
          configMap:
            name: {{ $rbacCM }}
        {{- end }}
        {{- if eq $authMode "oidc" }}
        - name: oidc
          secret:
            secretName: {{ $oidcSecretName }}
            optional: false
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
