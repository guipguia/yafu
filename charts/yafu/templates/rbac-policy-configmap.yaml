{{- if and .Values.authzPolicy.policy (not .Values.authzPolicy.existingConfigMap) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "yafu.fullname" . }}-rbac
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yafu.labels" . | nindent 4 }}
data:
  {{ .Values.authzPolicy.configMapKey | default "policy.yaml" }}: |-
{{ .Values.authzPolicy.policy | indent 4 }}
{{- end }}
