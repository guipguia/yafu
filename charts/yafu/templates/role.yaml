{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "yafu.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yafu.labels" . | nindent 4 }}
rules:
  # Read kubeconfig Secrets referenced by Cluster CRs without an explicit
  # namespace. If you store kubeconfigs in another namespace, create
  # additional Role / RoleBindings yourself.
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get", "list", "watch"]
{{- end }}
