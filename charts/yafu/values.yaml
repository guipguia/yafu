replicaCount: 1

# How yafu discovers clusters: "crd" (read Cluster CRs from the home cluster,
# default for in-cluster deployment) or "file" (read --config-file YAML).
clusterMode: crd

image:
  repository: ghcr.io/guipguia/yafu
  pullPolicy: IfNotPresent
  # Defaults to .Chart.AppVersion when empty.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: yafu.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Cluster-scoped Kubernetes RBAC for the controller's ServiceAccount.
# Distinct from `auth` below, which controls who can talk to the yafu API.
rbac:
  create: true

# How yafu authenticates incoming HTTP requests:
#   - "anonymous"  every request gets a synthetic identity. NOT for prod.
#   - "header"     trust X-Forwarded-User / -Email / -Groups injected by a
#                  reverse proxy (oauth2-proxy, Pomerium, ingress
#                  auth-snippet, …). The proxy MUST strip these headers
#                  from the public Internet — yafu trusts what arrives.
#   - "oidc"       native OIDC. Not yet implemented.
auth:
  mode: anonymous

# Authorization policy applied AFTER auth. When `policy` is empty, every
# authenticated user gets full access. Provide either an inline policy
# document below or set `existingConfigMap` to mount a Secret/ConfigMap
# you manage yourself.
authzPolicy:
  # Inline YAML policy. Shipped as a ConfigMap and mounted at
  # /etc/yafu/rbac/policy.yaml. Leave empty to skip the mount.
  policy: ""
  # ConfigMap key: defaults to "policy.yaml". Override only if you use
  # an existingConfigMap with a different key.
  configMapKey: policy.yaml
  # Reference an existing ConfigMap instead of generating one.
  existingConfigMap: ""

logLevel: info

env: []
nodeSelector: {}
tolerations: []
affinity: {}
