replicaCount: 1

# How yafu discovers clusters: "crd" (read Cluster CRs from the home cluster,
# default for in-cluster deployment) or "file" (read --config-file YAML).
clusterMode: crd

image:
  repository: ghcr.io/guipguia/yafu
  pullPolicy: IfNotPresent
  # Defaults to .Chart.AppVersion when empty.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: yafu.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Cluster-scoped Kubernetes RBAC for the controller's ServiceAccount.
# Distinct from `auth` below, which controls who can talk to the yafu API.
rbac:
  create: true

# How yafu authenticates incoming HTTP requests:
#   - "anonymous"  every request gets a synthetic identity. NOT for prod.
#   - "header"     trust X-Forwarded-User / -Email / -Groups injected by a
#                  reverse proxy (oauth2-proxy, Pomerium, ingress
#                  auth-snippet, …). The proxy MUST strip these headers
#                  from the public Internet — yafu trusts what arrives.
#   - "oidc"       native OIDC. yafu speaks the authorization-code-with-PKCE
#                  flow directly to your IdP. See `auth.oidc` below.
auth:
  mode: anonymous

  # Used when mode=oidc. The Helm chart will add the matching --oidc-* flags
  # to the Deployment and mount referenced Secrets into the pod.
  oidc:
    # Discovery URL of the IdP — must serve /.well-known/openid-configuration.
    # Examples: https://accounts.google.com, https://dex.example.com,
    #           https://your-tenant.okta.com
    issuer: ""
    clientId: ""

    # Public URL where /auth/callback is reachable. Must match exactly
    # what's registered with the IdP.
    redirectURL: ""

    scopes: "openid,email,profile,groups"
    groupsClaim: "groups"

    # Set to false only for HTTP dev; production deployments behind HTTPS
    # ingress should keep this true so cookies aren't sent over plain HTTP.
    secureCookie: true

    # Secret holding the OIDC client_secret and (optionally) a cookie-signing
    # secret. The chart mounts the referenced Secret at /etc/yafu/oidc/ and
    # passes --oidc-client-secret-file / --oidc-cookie-secret-file pointing
    # at the mounted keys.
    #
    # Recommended: create the Secret out-of-band (Sealed Secrets / External
    # Secrets) so the values file stays free of credentials.
    secretRef:
      name: ""             # required when mode=oidc
      clientSecretKey: client_secret
      cookieSecretKey: cookie_secret

# Authorization policy applied AFTER auth. When `policy` is empty, every
# authenticated user gets full access. Provide either an inline policy
# document below or set `existingConfigMap` to mount a Secret/ConfigMap
# you manage yourself.
authzPolicy:
  # Inline YAML policy. Shipped as a ConfigMap and mounted at
  # /etc/yafu/rbac/policy.yaml. Leave empty to skip the mount.
  policy: ""
  # ConfigMap key: defaults to "policy.yaml". Override only if you use
  # an existingConfigMap with a different key.
  configMapKey: policy.yaml
  # Reference an existing ConfigMap instead of generating one.
  existingConfigMap: ""

logLevel: info

env: []
nodeSelector: {}
tolerations: []
affinity: {}
